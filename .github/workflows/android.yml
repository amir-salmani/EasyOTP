name: android

on:
  push:
    paths: ["app/**", "gradle/**", "*.gradle.kts", "gradle.properties", ".github/workflows/android.yml"]
  pull_request:
    paths: ["app/**", "gradle/**", "*.gradle.kts", "gradle.properties"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      # Note the absence of EASYOTP_MIRRORS. CI resolves from Google and Maven
      # Central directly, so a published artifact is never built through a
      # third-party mirror (DECISIONS D11).
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      # The committed fixture only proves that whatever sealed it interoperates.
      # Regenerating here and opening it with the real relay suite is what makes
      # a change to either side's HPKE settings fail, instead of surfacing later
      # as the relay silently rejecting every message sent from the field.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Verify Android/Worker HPKE interop against a fresh fixture
        run: |
          set -euo pipefail
          test -f app/build/interop/hpke-fixture.json
          cp app/build/interop/hpke-fixture.json worker/test/hpke-fixture.json
          cd worker
          npm ci
          npx vitest run test/interop.spec.ts

      - name: Assemble debug
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Lint
        run: ./gradlew lintDebug --no-daemon
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        with:
          name: easyotp-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
