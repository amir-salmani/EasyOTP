# Tuned for a 16GB workstation that typically has under 4GB free. Defaults put a
# Gradle daemon and a Kotlin daemon at roughly 3.5GB between them, which the
# container cap turns into a SIGKILL mid-build -- observed, not theoretical.
# Heaps here total ~2GB, leaving room for AAPT2 and JVM overhead underneath a
# 4GB cap. Raise only if you also raise EASYOTP_MEM and actually have the RAM.
org.gradle.jvmargs=-Xmx1280m -XX:MaxMetaspaceSize=384m
kotlin.daemon.jvmargs=-Xmx768m
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
