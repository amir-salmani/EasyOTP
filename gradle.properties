# Tuned for a 16GB workstation that typically has ~4GB free. Defaults would put
# a Gradle daemon and a Kotlin daemon at roughly 3.5GB between them and push the
# desktop into swap; the container cap would then OOM-kill the build.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m
kotlin.daemon.jvmargs=-Xmx1024m
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
